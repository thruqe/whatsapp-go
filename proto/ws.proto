syntax = "proto3";

package whatsrook.ws;

option go_package = "whatsrook/proto/wsproto";

enum ControlType {
  CONTROL_TYPE_UNSPECIFIED = 0;
  CONTROL_TYPE_SEND_MESSAGE = 1;
  CONTROL_TYPE_SEND_REACTION = 2;
  CONTROL_TYPE_EDIT_MESSAGE = 3;
  CONTROL_TYPE_REVOKE_MESSAGE = 4;
  CONTROL_TYPE_GET_STATS = 5;
}

enum EventType {
  EVENT_TYPE_UNSPECIFIED = 0;
  EVENT_TYPE_PAIR_QR = 1;
  EVENT_TYPE_PAIR_CODE = 2;
  EVENT_TYPE_PAIR_SUCCESS = 3;
  EVENT_TYPE_PAIR_ERROR = 4;
  EVENT_TYPE_LOGGED_OUT = 5;
  EVENT_TYPE_DISCONNECTED = 6;
  EVENT_TYPE_CONNECTED = 7;
  EVENT_TYPE_INCOMING_MESSAGE = 8;
  EVENT_TYPE_INCOMING_CALL = 9;
  EVENT_TYPE_ACK = 10;
  EVENT_TYPE_STATS = 11;
}

// ControlFrame is sent by WebSocket clients to send data or request info from the bot daemon.
message ControlFrame {
  ControlType type = 1;
  string id = 2;

  oneof payload {
    SendMessagePayload send_message = 3;
    SendReactionPayload send_reaction = 4;
    EditMessagePayload edit_message = 5;
    RevokeMessagePayload revoke_message = 6;
    GetStatsPayload get_stats = 7;
  }
}

// EventFrame is sent by the bot daemon to connected WebSocket clients containing real-time data and stats.
message EventFrame {
  EventType type = 1;
  string id = 2;

  oneof payload {
    AckPayload ack = 3;
    StatsPayload stats = 4;
    PairQRPayload pair_qr = 5;
    PairCodePayload pair_code = 6;
    PairErrorPayload pair_error = 7;
    IncomingMessagePayload message = 8;
    IncomingCallPayload incoming_call = 9;
  }
}

message SendMessagePayload {
  string to = 1;
  string text = 2;
  optional string quote_id = 3;
  optional string quote_sender = 4;
}

message SendReactionPayload {
  string to = 1;
  string message_id = 2;
  optional string sender = 3;
  string emoji = 4;
}

message EditMessagePayload {
  string to = 1;
  string message_id = 2;
  string new_text = 3;
}

message RevokeMessagePayload {
  string to = 1;
  string message_id = 2;
  optional string original_sender = 3;
}

message GetStatsPayload {}

message AckPayload {
  bool ok = 1;
  optional string error = 2;
}

message StatsPayload {
  bool connected = 1;
  bool logged_in = 2;
  optional string jid = 3;
  optional string push_name = 4;
  optional string bot_name = 5;
  optional string prefix = 6;
  optional string mode = 7;
  int64 uptime_seconds = 8;
  string uptime_formatted = 9;
  uint64 memory_used_bytes = 10;
  string memory_used_formatted = 11;
  uint64 memory_sys_bytes = 12;
  uint32 active_plugins_count = 13;
  uint32 connected_ws_clients = 14;
  string platform_os = 15;
  string go_version = 16;
  string app_version = 17;
  string session_phone = 18;
  bool network_paused = 19;
  uint32 db_contacts_count = 20;
  string db_driver = 21;
  bool anticall_enabled = 22;
  bool likestatus_enabled = 23;
  uint32 sudoers_count = 24;
}

message PairQRPayload {
  string code = 1;
}

message PairCodePayload {
  string code = 1;
}

message PairErrorPayload {
  string reason = 1;
}

message IncomingMessagePayload {
  string from = 1;
  string chat = 2;
  string sender = 3;
  string text = 4;
  string message_id = 5;
  optional string push_name = 6;
  int64 timestamp_unix = 7;
  bool is_group = 8;
  bool is_from_me = 9;
  optional string media_type = 10;
  optional string quoted_id = 11;
  optional string quoted_text = 12;
}

message IncomingCallPayload {
  string call_id = 1;
  string from = 2;
  int64 timestamp_unix = 3;
}
