<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsApp Webview Test</title>
  <style>
    * { box-sizing: border-box; }
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #075e54 0%, #128c7e 100%);
      color: #ffffff;
      text-align: center;
    }
    .card {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 20px;
      padding: 32px 24px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }
    h1 {
      font-size: 32px;
      margin: 0 0 12px 0;
      letter-spacing: -0.5px;
    }
    p {
      font-size: 16px;
      margin: 0 0 20px 0;
      line-height: 1.5;
      opacity: 0.95;
    }
    .tag {
      display: inline-block;
      padding: 8px 16px;
      border-radius: 24px;
      font-size: 14px;
      font-weight: 600;
      background: #25d366;
      color: #0c3325;
      margin-bottom: 20px;
    }
    .details {
      text-align: left;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 12px;
      padding: 14px;
      font-size: 12px;
      font-family: monospace;
      word-break: break-all;
      color: #e0f2f1;
    }
    .details strong {
      display: block;
      margin-bottom: 6px;
      color: #80cbc4;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Hello World! 👋</h1>
    <p>This is a local HTML page served from your bot to test WhatsApp's in-app webview integration.</p>
    <div class="tag" id="status-tag">Checking Client...</div>
    <div class="details">
      <strong>User Agent:</strong>
      <span id="ua-text"></span>
    </div>
  </div>

  <script>
    const ua = navigator.userAgent;
    document.getElementById('ua-text').textContent = ua;

    const tag = document.getElementById('status-tag');
    // Check if running inside WhatsApp Webview or general in-app webview
    if (/WhatsApp/i.test(ua) || /FB_IAB|FB4A|FBAV/i.test(ua)) {
      tag.textContent = "✅ Running in In-App Webview";
      tag.style.background = "#ffffff";
      tag.style.color = "#075e54";
    } else {
      tag.textContent = "🌐 Browser / Webview Detected";
    }
  </script>
</body>
</html>
