# Configuration for PR path-based labeling (actions/labeler)
build:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**'
          - 'Taskfile.yml'
          - 'go.mod'
          - 'go.sum'
          - 'scripts/**'

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - 'docs/**'
          - '*.md'
          - 'LICENSE'

area:core:
  - changed-files:
      - any-glob-to-any-file:
          - '*.go'
          - 'lib/**'

area:cli:
  - changed-files:
      - any-glob-to-any-file:
          - 'cmd/**'

area:plugins:
  - changed-files:
      - any-glob-to-any-file:
          - 'cmd/plugins/**'

area:voip:
  - changed-files:
      - any-glob-to-any-file:
          - 'lib/mlow/**'
          - 'lib/rtp/**'
          - 'lib/srtp/**'
          - 'lib/stun/**'
          - 'lib/call*.go'

area:utils:
  - changed-files:
      - any-glob-to-any-file:
          - 'src/**'
          - 'cmd/utils/**'
