name: Addons Release

on:
  push:
    branches:
      - master
    paths:
      - "pkg/addons/**"
    tags:
      - "addons-v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag name (leave blank to target latest release or plugins)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            name: linux-amd64
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            name: linux-arm64
          - os: macos-latest
            goos: darwin
            goarch: amd64
            name: darwin-amd64
          - os: macos-latest
            goos: darwin
            goarch: arm64
            name: darwin-arm64
          - os: windows-latest
            goos: windows
            goarch: amd64
            name: windows-amd64

    defaults:
      run:
        working-directory: pkg/addons

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true

      - name: Build release binaries
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p bin
          PLUGINS=("btc" "calc" "captcha" "circle" "cpu" "crop" "fact" "fancy" "font" "fonts" "git" "joke" "markets" "media" "memory" "mp4url" "news" "qrcode" "quotes" "rizz" "shorturl" "ss" "sticker" "take" "tts" "urban" "wabeta" "weather" "why")
          
          if [ "${{ matrix.goos }}" = "windows" ]; then
            EXE_EXT=".exe"
          else
            EXE_EXT=""
          fi

          for p in "${PLUGINS[@]}"; do
            echo "Building $p..."
            go build -trimpath -ldflags="-s -w -buildid=" -o "bin/${p}${EXE_EXT}" "./${p}"
          done

      - name: Package artifacts
        shell: bash
        run: |
          mkdir -p dist
          PLUGINS=("btc" "calc" "captcha" "circle" "cpu" "crop" "fact" "fancy" "font" "fonts" "git" "joke" "markets" "media" "memory" "mp4url" "news" "qrcode" "quotes" "rizz" "shorturl" "ss" "sticker" "take" "tts" "urban" "wabeta" "weather" "why")
          
          if [ "${{ matrix.goos }}" = "windows" ]; then
            EXE_EXT=".exe"
          else
            EXE_EXT=""
          fi

          # Copy and rename individual binaries
          for p in "${PLUGINS[@]}"; do
            src="bin/${p}${EXE_EXT}"
            dest="dist/${p}-${{ matrix.name }}${EXE_EXT}"
            cp "$src" "$dest"
          done

          # Create comprehensive archive bundle
          BUNDLE_DIR="whatsrook-addons-${{ matrix.name }}"
          mkdir -p "$BUNDLE_DIR"
          for p in "${PLUGINS[@]}"; do
            cp "bin/${p}${EXE_EXT}" "$BUNDLE_DIR/"
          done
          [ -f README.md ] && cp README.md "$BUNDLE_DIR/" || true

          if [ "${{ matrix.goos }}" = "windows" ]; then
            7z a "dist/whatsrook-addons-${{ matrix.name }}.zip" "$BUNDLE_DIR"
          else
            tar -czvf "dist/whatsrook-addons-${{ matrix.name }}.tar.gz" "$BUNDLE_DIR"
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.name }}
          path: pkg/addons/dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Determine tag name and target release
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GIT_TOKEN || secrets.RELEASE_PAT || secrets.PAT || secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG=$(gh release view --json tagName -q .tagName 2>/dev/null || echo "")
            if [ -z "$TAG" ]; then
              TAG="plugins"
            fi
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Publish / Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GIT_TOKEN || secrets.RELEASE_PAT || secrets.PAT || secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          echo "Targeting release tag: $TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists. Uploading release assets..."
            gh release upload "$TAG" release-assets/* --clobber
          else
            echo "Release $TAG does not exist. Creating new release..."
            gh release create "$TAG" release-assets/* \
              --title "WhatsRook Addon Plugins ($TAG)" \
              --notes "Automated addon plugin release build from commit \`${{ github.sha }}\` on $(date -u +'%Y-%m-%d %H:%M:%S UTC')." \
              --latest \
              --target "${{ github.sha }}"
          fi

          if [ "$TAG" != "plugins" ]; then
            echo "Mirroring assets to persistent 'plugins' release..."
            if gh release view "plugins" >/dev/null 2>&1; then
              gh release upload "plugins" release-assets/* --clobber
            else
              gh release create "plugins" release-assets/* \
                --title "WhatsRook Addon Plugins (Persistent Registry)" \
                --notes "Official persistent release registry for addon plugins." \
                --target "${{ github.sha }}" || true
            fi
          fi
