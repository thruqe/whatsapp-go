name: Addons CI

on:
  push:
    branches: [master]
    paths:
      - "pkg/addons/**"
      - ".github/workflows/addons-ci.yml"
  pull_request:
    branches: [master]
    paths:
      - "pkg/addons/**"
      - ".github/workflows/addons-ci.yml"
  workflow_dispatch:

jobs:
  check:
    name: Check & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true

      - name: Check code formatting
        run: |
          unformatted=$(gofmt -s -l pkg/addons/)
          if [ -n "$unformatted" ]; then
            echo "Unformatted files found: $unformatted"
            exit 1
          fi

      - name: Go vet
        run: |
          go -C pkg/addons/sdk vet ./...
          go -C pkg/addons vet ./...

      - name: Test SDK
        run: go -C pkg/addons/sdk test -v ./...

      - name: Build all addon plugins
        run: go -C pkg/addons build -v ./...
