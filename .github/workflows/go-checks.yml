name: Go Code Quality & Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  go-checks:
    name: Code Quality & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true

      - name: Check Formatting (gofmt)
        run: |
          unformatted=$(gofmt -s -l .)
          if [ -n "$unformatted" ]; then
            echo "The following Go files are not formatted correctly:"
            echo "$unformatted"
            echo "Please run 'gofmt -w -s .' on your files and commit the changes."
            exit 1
          fi

      - name: Vet Code (go vet)
        run: |
          go vet ./...
          (cd lib && go vet ./...)
          (cd cmd && go vet ./...)

      - name: Static Analysis (staticcheck)
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...
          (cd lib && staticcheck ./...)
          (cd cmd && staticcheck ./...)

      - name: Run Tests (go test)
        run: |
          go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...
          (cd lib && go test -v -race ./...)
          (cd cmd && go test -v -race ./...)

      - name: Verify Build
        env:
          GOEXPERIMENT: nojsonv2
        run: |
          go build -v ./...
          (cd cmd && go build -v .)
