name: Go Code Quality & Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  go-checks:
    name: Code Quality & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: "**/go.sum"

      - name: Download Dependencies
        run: |
          for i in 1 2 3; do
            (cd pkg/engine && go mod download) && \
            (cd pkg/whatsrook && go mod download) && \
            (cd bot && go mod download) && break || sleep 3
          done

      - name: Check Formatting (gofmt)
        run: |
          unformatted=$(gofmt -s -l .)
          if [ -n "$unformatted" ]; then
            echo "The following Go files are not formatted correctly:"
            echo "$unformatted"
            echo "Please run 'gofmt -w -s .' on your files and commit the changes."
            exit 1
          fi

      - name: Vet Code (go vet)
        run: |
          (cd pkg/engine && go vet ./...)
          (cd pkg/whatsrook && go vet ./...)
          (cd bot && go vet ./...)

      - name: Deadcode Analysis (deadcode)
        run: |
          for i in 1 2 3; do
            go install golang.org/x/tools/cmd/deadcode@latest && break || sleep 3
          done
          (cd bot && deadcode .)

      - name: Static Analysis (staticcheck)
        run: |
          for i in 1 2 3; do
            go install honnef.co/go/tools/cmd/staticcheck@v0.7.0-0.dev.0.20261009230814-452d5bb86b45 && break || sleep 3
          done
          (cd pkg/engine && staticcheck ./...)
          (cd pkg/whatsrook && staticcheck ./...)
          (cd bot && staticcheck ./...)

      - name: Run Tests (go test)
        run: |
          (cd pkg/engine && go test -v -race ./...)
          (cd pkg/whatsrook && go test -v -race ./...)
          (cd bot && go test -v -race ./...)

      - name: Verify Build
        env:
          GOEXPERIMENT: nojsonv2
        run: |
          (cd pkg/whatsrook && go build -v ./...)
          (cd bot && go build -v .)
