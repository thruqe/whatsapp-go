name: Scheduled Version Bump

on:
  schedule:
    - cron: '0 22 * * 5' # Runs every Friday at 22:00 UTC (10:00 PM UTC)
  workflow_dispatch:     # Allows manual execution from GitHub Actions UI

permissions:
  contents: write
  actions: write

jobs:
  bump-and-release:
    name: Check & Bump Version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Check Commit History Since Last Release
        id: check-history
        run: |
          git fetch --tags --prune origin

          # Find the latest semantic version tag
          LATEST_TAG=$(git tag -l "v*" --sort=-v:refname | head -n 1)
          echo "Latest release tag: ${LATEST_TAG:-none}"

          if [ -n "$LATEST_TAG" ]; then
            # Count commits between the latest release tag and current HEAD
            COMMITS_SINCE_RELEASE=$(git rev-list "${LATEST_TAG}..HEAD" --count)
            echo "Commits since last release ($LATEST_TAG): $COMMITS_SINCE_RELEASE"

            if [ "$COMMITS_SINCE_RELEASE" -eq 0 ]; then
              echo "::notice::HEAD is at the previous release tag ($LATEST_TAG). No new commits since last release. Skipping bump."
              echo "should_bump=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            # Check if the latest commit itself is a release or bump commit
            LAST_COMMIT_MSG=$(git log -1 --format='%s')
            echo "Latest commit subject: $LAST_COMMIT_MSG"
            if echo "$LAST_COMMIT_MSG" | grep -iE '^(chore|ci|release):?\s*bump|^Release\s+v' >/dev/null 2>&1; then
              if [ "$COMMITS_SINCE_RELEASE" -le 1 ]; then
                echo "::notice::Previous commit is a release/bump commit. No new changes to release. Skipping bump."
                echo "should_bump=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
          else
            echo "No previous release tags found. Proceeding with bump."
          fi

          echo "should_bump=true" >> "$GITHUB_OUTPUT"

      - name: Setup Go Toolchain
        if: steps.check-history.outputs.should_bump == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Setup Task
        if: steps.check-history.outputs.should_bump == 'true'
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Task Bump
        id: run-bump
        if: steps.check-history.outputs.should_bump == 'true'
        run: |
          task bump

          if git diff --quiet && git diff --staged --quiet; then
            echo "::notice::task bump produced no changes. Version is already up to date."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            NEW_VERSION=$(tr -d '[:space:]' < version.txt)
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
            echo "Version bumped to: $NEW_VERSION"
          fi

      - name: Commit and Push Bump
        if: steps.check-history.outputs.should_bump == 'true' && steps.run-bump.outputs.has_changes == 'true'
        env:
          NEW_VERSION: ${{ steps.run-bump.outputs.version }}
          GH_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add version.txt cmd/updater/updater.go cmd/versioninfo.json
          git commit -m "chore: bump version to v${NEW_VERSION}"
          git push origin master

          # Trigger Release Management workflow if push does not trigger it automatically
          gh workflow run release.yml --ref master || gh workflow run "Release Management" --ref master || true
