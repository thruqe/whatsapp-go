name: Release Management
on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (optional, format: YY.MM.CRYPTO_PATCH_EXTRA_BUILD_INFO)'
        required: false
permissions:
  contents: write
jobs:
  check-version:
    name: Check Version and Release Status
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.version-check.outputs.changed }}
      version: ${{ steps.version-check.outputs.version }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN || secrets.GIT_TOKEN || secrets.RELEASE_PAT || secrets.PAT || secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Parse Version and Check Release Status
        id: version-check
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GIT_TOKEN || secrets.RELEASE_PAT || secrets.PAT || secrets.GITHUB_TOKEN }}
        run: |
          git fetch --tags origin 2>/dev/null || true

          CURRENT_VERSION=""
          IS_PROD_RELEASE="false"

          # 1. Triggered directly by a tag push (v*)
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            CURRENT_VERSION="${GITHUB_REF_NAME#v}"
            IS_PROD_RELEASE="true"
          # 2. Triggered by workflow_dispatch with explicit version input
          elif [ -n "${{ inputs.version }}" ]; then
            CURRENT_VERSION="${{ inputs.version }}"
            CURRENT_VERSION="${CURRENT_VERSION#v}"
            IS_PROD_RELEASE="true"
          # 3. Triggered by push to master: check if HEAD has an unreleased tag
          else
            HEAD_TAG=$(git tag --points-at HEAD "v*" | head -n 1)
            if [ -n "$HEAD_TAG" ]; then
              CURRENT_VERSION="${HEAD_TAG#v}"
              if ! gh release view "$HEAD_TAG" >/dev/null 2>&1; then
                IS_PROD_RELEASE="true"
              fi
            fi
          fi

          if [ -z "$CURRENT_VERSION" ]; then
            CURRENT_VERSION=$(git rev-parse --short=7 HEAD)
          fi

          echo "Resolved version: $CURRENT_VERSION (Production release: $IS_PROD_RELEASE)"
          echo "changed=$IS_PROD_RELEASE" >> "$GITHUB_OUTPUT"
          echo "version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"

  build:
    name: Build Binaries (${{ matrix.target.os }}-${{ matrix.target.arch }})
    needs: [check-version]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - os: linux
            arch: amd64
            ext: ""
          - os: linux
            arch: arm64
            ext: ""
          - os: android
            arch: arm64
            ext: ""
          - os: windows
            arch: amd64
            ext: ".exe"
          - os: windows
            arch: arm64
            ext: ".exe"
          - os: darwin
            arch: amd64
            ext: ""
          - os: darwin
            arch: arm64
            ext: ""
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN || secrets.GIT_TOKEN || secrets.RELEASE_PAT || secrets.PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Go Toolchain
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # Disable the shared actions/setup-go cache. With matrix legs
          # building concurrently from the same repo, a cache key collision
          # (or a race populating GOCACHE) can let one target's linked
          # binary get replaced by another target's cached-but-unlinked
          # object/archive output. Building clean removes that failure mode.
          cache: false

      - name: Build Binary
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.target.os }}
          GOARCH: ${{ matrix.target.arch }}
          # Give every matrix leg its own isolated build cache directory so
          # there is no way for GOOS/GOARCH-specific compiled objects to be
          # reused across targets even if Go's own cache keying misbehaves.
          GOCACHE: ${{ github.workspace }}/.gocache-${{ matrix.target.os }}-${{ matrix.target.arch }}
          GOEXPERIMENT: nojsonv2
        run: |
          BIN_NAME="whatsrook${{ matrix.target.ext }}"
          COMMIT_SHA="${{ github.sha }}"
          if [ "${{ needs.check-version.outputs.changed }}" = "true" ]; then
            APP_VERSION="${{ needs.check-version.outputs.version }}"
          else
            APP_VERSION="$COMMIT_SHA"
          fi
          echo "Building WhatsRook version: $APP_VERSION (commit: $COMMIT_SHA)"

          if [ "${{ matrix.target.os }}" = "windows" ]; then
            GOOS="" GOARCH="" go -C scripts run . res "$APP_VERSION"
          fi
          (cd cmd && go build -trimpath -ldflags="-s -w -buildid= -X main.Version=${APP_VERSION} -X whatsrook/cmd/updater.BinaryVersion=${APP_VERSION} -X whatsrook/cmd/updater.CommitSHA=${COMMIT_SHA}" -v -o "../$BIN_NAME" .)
          echo "BIN_NAME=$BIN_NAME" >> "$GITHUB_ENV"

      - name: Sign Windows Binary
        if: matrix.target.os == 'windows'
        run: |
          sudo apt-get update && sudo apt-get install -y osslsigncode
          go -C scripts run . sign "$BIN_NAME"

      - name: Verify Binary
        run: |
          echo "Inspecting build output for ${{ matrix.target.os }}-${{ matrix.target.arch }}:"
          file "$BIN_NAME"

          case "${{ matrix.target.os }}" in
            windows)
              # Expect an MZ/PE header (bytes "4d 5a")
              HEADER=$(head -c 2 "$BIN_NAME" | xxd -p)
              if [ "$HEADER" != "4d5a" ]; then
                echo "::error::Build produced an invalid PE binary for ${{ matrix.target.os }}-${{ matrix.target.arch }}. First bytes: $HEADER"
                exit 1
              fi
              ;;
            darwin)
              # Expect Mach-O magic (feedface, feedfacf, cafebabe for fat binaries)
              HEADER=$(head -c 4 "$BIN_NAME" | xxd -p)
              case "$HEADER" in
                feedface|feedfacf|cafebabe|cffaedfe|cefaedfe) ;;
                *)
                  echo "::error::Build produced an invalid Mach-O binary for ${{ matrix.target.os }}-${{ matrix.target.arch }}. First bytes: $HEADER"
                  exit 1
                  ;;
              esac
              ;;
            linux|android)
              # Expect ELF magic (7f 45 4c 46 = "\x7fELF")
              HEADER=$(head -c 4 "$BIN_NAME" | xxd -p)
              if [ "$HEADER" != "7f454c46" ]; then
                echo "::error::Build produced an invalid ELF binary for ${{ matrix.target.os }}-${{ matrix.target.arch }}. First bytes: $HEADER (this is the '!<arch>'/__.PKGDEF signature of an unlinked Go archive object, not a linked executable, if it decodes to '213c61' etc.)"
                exit 1
              fi
              ;;
          esac

          echo "Verified: $BIN_NAME is a valid native executable for ${{ matrix.target.os }}-${{ matrix.target.arch }}."

      - name: Package Asset
        run: |
          mkdir staging
          cp "$BIN_NAME" staging/
          tar -czf whatsrook-${{ matrix.target.os }}-${{ matrix.target.arch }}.tar.gz -C staging .

      - name: Upload Intermediary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: whatsrook-${{ matrix.target.os }}-${{ matrix.target.arch }}
          path: whatsrook-${{ matrix.target.os }}-${{ matrix.target.arch }}.tar.gz

  alpha-release:
    name: Alpha Nightly Per-Commit Release
    needs: [check-version, build]
    if: (!startsWith(github.ref, 'refs/tags/')) && needs.check-version.outputs.changed != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN || secrets.GIT_TOKEN || secrets.RELEASE_PAT || secrets.PAT || secrets.GITHUB_TOKEN }}
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Remove Stale Release Assets
        run: |
          # Purge stale assets from the alpha release: old zevBot artifacts and
          # the whatsrook-windows-amd64.zip left over before the .tar.gz switch
          ASSET_IDS=$(gh api repos/${{ github.repository }}/releases/tags/alpha \
            --jq '.assets[] | select(
              (.name | startswith("zevBot")) or
              (.name == "whatsrook-windows-amd64.zip") or
              (.name == "whatsrook-source.tar.gz")
            ) | .id' 2>/dev/null || true)
          for ASSET_ID in $ASSET_IDS; do
            gh api --method DELETE repos/${{ github.repository }}/releases/assets/$ASSET_ID || true
          done
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GIT_TOKEN || secrets.RELEASE_PAT || secrets.PAT || secrets.GITHUB_TOKEN }}
      - name: Configure Git User
        run: |
          git config --global user.name "Thruqe"
          git config --global user.email "danielpeter0039@gmail.com"
      - name: Advance Alpha Tag to HEAD
        run: |
          # Force-move the alpha tag to the current commit so GitHub regenerates
          # the "Source code (zip)" and "Source code (tar.gz)" release archives
          git tag -f alpha
          git push -f origin alpha
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GIT_TOKEN || secrets.RELEASE_PAT || secrets.PAT || secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GIT_TOKEN || secrets.RELEASE_PAT || secrets.PAT || secrets.GITHUB_TOKEN }}
      - name: Get Commit Info
        id: commit-info
        run: |
          echo "subject=$(git log -1 --format='%s')" >> $GITHUB_OUTPUT
          echo "body<<EOF" >> $GITHUB_OUTPUT
          git log -1 --format='%b' >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      - name: Publish Alpha Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: alpha
          name: "Nightly / Alpha Build"
          body: |
            **${{ steps.commit-info.outputs.subject }}**

            ${{ steps.commit-info.outputs.body }}

            **Commit:** ${{ github.sha }}
          prerelease: true
          make_latest: false
          files: artifacts/*/*
          token: ${{ secrets.GH_TOKEN || secrets.GIT_TOKEN || secrets.RELEASE_PAT || secrets.PAT || secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GIT_TOKEN || secrets.RELEASE_PAT || secrets.PAT || secrets.GITHUB_TOKEN }}

  production-release:
    name: Production Release
    needs: [check-version, build]
    if: needs.check-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code for Tagging
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN || secrets.GIT_TOKEN || secrets.RELEASE_PAT || secrets.PAT || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure Git User
        run: |
          git config --global user.name "Thruqe"
          git config --global user.email "danielpeter0039@gmail.com"

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Git Tag if Missing
        run: |
          TAG="v${{ needs.check-version.outputs.version }}"
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GIT_TOKEN || secrets.RELEASE_PAT || secrets.PAT || secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GIT_TOKEN || secrets.RELEASE_PAT || secrets.PAT || secrets.GITHUB_TOKEN }}

      - name: Publish Production Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ needs.check-version.outputs.version }}"
          name: "Release v${{ needs.check-version.outputs.version }}"
          generate_release_notes: true
          draft: false
          prerelease: false
          files: artifacts/*/*
          token: ${{ secrets.GH_TOKEN || secrets.GIT_TOKEN || secrets.RELEASE_PAT || secrets.PAT || secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GIT_TOKEN || secrets.RELEASE_PAT || secrets.PAT || secrets.GITHUB_TOKEN }}
