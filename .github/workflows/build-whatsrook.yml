name: Build and Push whatsrook

on:
  push:
    branches: [ master ]

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: thruqe/whatsrook:latest

      - name: Trigger project rebuild
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.PROJECT_REPO_PAT }}
          repository: thruqe/whatsrook
          event-type: whatsrook-updated
