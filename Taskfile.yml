version: "3"

env:
  PATH:
    sh: echo "$HOME/go/bin:$PATH"

vars:
  BINARY_NAME: "whatsrook{{exeExt}}"
  BIN_PATH: "bin/{{.BINARY_NAME}}"

tasks:
  default:
    cmds:
      - task --list
    silent: true

  install:
    desc: Install Go module dependencies
    cmds:
      - go mod download
      - go mod tidy
      - cd cmd && go mod download && go mod tidy

  fix:
    desc: Apply go fix modernizers across all modules
    cmds:
      - go fix ./...
      - cd wa-core && go fix ./...
      - cd cmd && go fix ./...

  fmt:
    desc: Format, vet, and staticcheck all Go code
    cmds:
      - go fmt ./...
      - gofmt -w -s .
      - cd wa-core && go fmt ./...
      - cd wa-core && gofmt -w -s .
      - cd cmd && go fmt ./...
      - cd cmd && gofmt -w -s .
      - go vet ./...
      - cd wa-core && go vet ./...
      - cd cmd && go vet ./...
      - command -v staticcheck >/dev/null 2>&1 && staticcheck ./... || ([ -x "$(go env GOPATH)/bin/staticcheck" ] && "$(go env GOPATH)/bin/staticcheck" ./...) || true
      - cd wa-core && (command -v staticcheck >/dev/null 2>&1 && staticcheck ./... || ([ -x "$(go env GOPATH)/bin/staticcheck" ] && "$(go env GOPATH)/bin/staticcheck" ./...) || true)
      - cd cmd && (command -v staticcheck >/dev/null 2>&1 && staticcheck ./... || ([ -x "$(go env GOPATH)/bin/staticcheck" ] && "$(go env GOPATH)/bin/staticcheck" ./...) || true)

  deadcode:
    desc: Analyze unreachable functions across the codebase
    cmds:
      - cd cmd && (command -v deadcode >/dev/null 2>&1 && deadcode . || ([ -x "$(go env GOPATH)/bin/deadcode" ] && "$(go env GOPATH)/bin/deadcode" .) || true)

  test:
    desc: Run the test suite
    cmds:
      - |
        PKGS=$(go list -f '{{"{{"}}if .TestGoFiles{{"}}"}}{{"{{"}}.ImportPath{{"}}"}}{{"{{"}}end{{"}}"}}' ./...)
        if [ -n "$PKGS" ]; then go test -v -timeout 120s $PKGS; fi
      - cd wa-core && go test -v -timeout 60s ./...
      - cd cmd && go test -v -timeout 60s ./...

  update:
    desc: Upgrade all Go dependencies
    cmds:
      - go get -u ./...
      - go mod tidy
      - cd cmd && go get -u ./...
      - cd cmd && go mod tidy

  bump:
    desc: Bump release version to current date (day.month.year) across version.txt and cmd
    cmds:
      - go -C scripts run . bump {{.cmd_ARGS}}

  proto:
    desc: Compile and update all wa-core protobuf definitions
    cmds:
      - go -C scripts run . proto {{.cmd_ARGS}}

  proto:sync:
    desc: Pull latest WAProto schema, split into modular wa-core/proto, and recompile
    cmds:
      - go -C scripts run . proto --sync {{.cmd_ARGS}}

  res:
    desc: Generate Windows binary resource metadata and icons from assets/logo.png
    cmds:
      - go -C scripts run . res

  build:
    desc: "Build stripped, optimized binary executable into {{.BIN_PATH}}"
    env:
      GOEXPERIMENT: nojsonv2
    cmds:
      - cmd: mkdir -p bin
        platforms: [linux, darwin, windows]
      - cmd: go -C scripts run . res
        platforms: [windows]
      - cd cmd && go build -trimpath -ldflags="-s -w -buildid=" -v -o ../{{.BIN_PATH}} .

  clean:
    desc: Remove build artifacts and temporary files
    cmds:
      - cmd: rm -rf bin/ tmp/
        platforms: [linux, darwin]
      - cmd: powershell -Command "Remove-Item -Recurse -Force bin, tmp -ErrorAction SilentlyContinue"
        platforms: [windows]

  pg:start:
    desc: Start local PostgreSQL database server on port 5433
    cmds:
      - |
        PG_BIN=$(which pg_ctl 2>/dev/null || ls /usr/pgsql-*/bin/pg_ctl 2>/dev/null | head -n 1)
        if [ -z "$PG_BIN" ]; then echo "pg_ctl not found"; exit 1; fi
        $PG_BIN -D ~/.whatsrook/pgdata -l ~/.whatsrook/postgres.log -o "-p 5433 -k ~/.whatsrook/pgdata" start || true

  pg:stop:
    desc: Stop local PostgreSQL database server
    cmds:
      - |
        PG_BIN=$(which pg_ctl 2>/dev/null || ls /usr/pgsql-*/bin/pg_ctl 2>/dev/null | head -n 1)
        if [ -z "$PG_BIN" ]; then echo "pg_ctl not found"; exit 1; fi
        $PG_BIN -D ~/.whatsrook/pgdata stop || true

  pg:status:
    desc: Check local PostgreSQL database server status
    cmds:
      - |
        PG_BIN=$(which pg_ctl 2>/dev/null || ls /usr/pgsql-*/bin/pg_ctl 2>/dev/null | head -n 1)
        if [ -z "$PG_BIN" ]; then echo "pg_ctl not found"; exit 1; fi
        $PG_BIN -D ~/.whatsrook/pgdata status || true
