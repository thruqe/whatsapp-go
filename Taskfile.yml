version: "3"

env:
  PATH:
    sh: echo "$(go env GOPATH)/bin:$HOME/go/bin:$PATH"

vars:
  BINARY_NAME: "whatsrook{{exeExt}}"
  BIN_PATH: "bin/{{.BINARY_NAME}}"

tasks:
  default:
    cmds:
      - task --list
    silent: true

  install:
    desc: Install Go module dependencies
    cmds:
      - go mod download
      - go mod tidy
      - go -C pkg/engine mod download
      - go -C pkg/engine mod tidy
      - go -C cmd mod download
      - go -C cmd mod tidy
      - go -C scripts mod download
      - go -C scripts mod tidy
      - go -C pkg/addons/sdk mod download
      - go -C pkg/addons/sdk mod tidy
      - go -C pkg/addons mod download
      - go -C pkg/addons mod tidy

  fix:
    desc: Apply go fix modernizers across all modules
    cmds:
      - go fix ./...
      - go -C pkg/engine fix ./...
      - go -C cmd fix ./...
      - go -C scripts fix ./...
      - go -C pkg/addons/sdk fix ./...
      - go -C pkg/addons fix ./...

  fmt:
    desc: Format, vet, and staticcheck all Go code
    cmds:
      - go fmt ./...
      - go -C pkg/engine fmt ./...
      - go -C cmd fmt ./...
      - go -C scripts fmt ./...
      - go -C pkg/addons/sdk fmt ./...
      - go -C pkg/addons fmt ./...
      - gofmt -w -s .
      - go vet ./...
      - go -C pkg/engine vet ./...
      - go -C cmd vet ./...
      - go -C scripts vet ./...
      - go -C pkg/addons/sdk vet ./...
      - go -C pkg/addons vet ./...
      - staticcheck ./...
      - (cd pkg/engine && staticcheck ./...)
      - (cd cmd && staticcheck ./...)
      - (cd scripts && staticcheck ./...)
      - (cd pkg/addons/sdk && staticcheck ./...)
      - (cd pkg/addons && staticcheck ./...)

  deadcode:
    desc: Analyze unreachable functions across the codebase
    cmds:
      - cd cmd && deadcode .

  test:
    desc: Run the test suite
    cmds:
      - go test -v -timeout 120s ./...
      - go -C pkg/engine test -v -timeout 60s ./...
      - go -C cmd test -v -timeout 60s ./...
      - go -C pkg/addons/sdk test -v -timeout 60s ./...
      - go -C pkg/addons test -v -timeout 60s ./...

  update:
    desc: Upgrade all Go dependencies
    cmds:
      - go get -u ./...
      - go mod tidy
      - go -C pkg/engine get -u ./...
      - go -C pkg/engine mod tidy
      - go -C cmd get -u ./...
      - go -C cmd mod tidy
      - go -C scripts get -u ./...
      - go -C scripts mod tidy
      - go -C pkg/addons/sdk get -u ./...
      - go -C pkg/addons/sdk mod tidy
      - go -C pkg/addons get -u ./...
      - go -C pkg/addons mod tidy

  bump:
    desc: Bump monthly release version (YY.MM.CRYPTO_PATCH_EXTRA_BUILD_INFO) and refresh binary resources
    cmds:
      - go -C scripts run . bump {{.CLI_ARGS}}

  proto:
    desc: Compile and update all engine protobuf definitions
    cmds:
      - go -C scripts run . proto {{.CLI_ARGS}}

  proto:sync:
    desc: Pull latest WAProto schema, split into modular pkg/engine/proto, and recompile
    cmds:
      - go -C scripts run . proto --sync {{.CLI_ARGS}}

  res:
    desc: Generate Windows binary resource metadata and icons from Cloudflare R2 logo
    cmds:
      - go -C scripts run . res {{.CLI_ARGS}}

  sign:
    desc: Digitally sign Windows PE executable binary with SHA-256 Authenticode signature
    cmds:
      - go -C scripts run . sign {{.CLI_ARGS | default .BIN_PATH}}

  build:
    desc: "Build stripped, optimized binary executable into {{.BIN_PATH}}"
    env:
      GOEXPERIMENT: nojsonv2
    cmds:
      - cmd: mkdir -p bin
        platforms: [linux, darwin, windows]
      - cmd: go -C scripts run . res
        platforms: [windows]
      - go -C cmd build -trimpath -ldflags="-s -w -buildid=" -v -o ../{{.BIN_PATH}} .

  build:upx:
    desc: "Build stripped binary and compress with UPX into {{.BIN_PATH}}"
    cmds:
      - task: build
      - upx --best {{.BIN_PATH}}
      - upx -t {{.BIN_PATH}}

  build:addons:
    desc: Build all Go addon plugin binaries
    cmds:
      - go -C pkg/addons build ./...

  clean:
    desc: Remove build artifacts and temporary files
    cmds:
      - cmd: rm -rf bin/ tmp/ coverage.txt
        platforms: [linux, darwin]
      - cmd: powershell -Command "if (Test-Path bin) { Remove-Item -Recurse -Force bin }; if (Test-Path tmp) { Remove-Item -Recurse -Force tmp }; if (Test-Path coverage.txt) { Remove-Item -Force coverage.txt }"
        platforms: [windows]
      - go clean -cache -testcache
      - go -C pkg/engine clean -cache -testcache
      - go -C cmd clean -cache -testcache
      - go -C pkg/addons/sdk clean -cache -testcache
      - go -C pkg/addons clean -cache -testcache
