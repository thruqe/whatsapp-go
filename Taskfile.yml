version: "3"

vars:
  BINARY_NAME: "whatsrook{{exeExt}}"
  BIN_PATH: "bin/{{.BINARY_NAME}}"

tasks:
  default:
    cmds:
      - task --list
    silent: true

  install:
    desc: Install Go module dependencies
    cmds:
      - go mod download
      - go mod tidy
      - cd cli && go mod download && go mod tidy

  fix:
    desc: Apply go fix modernizers across all modules
    cmds:
      - go fix ./...
      - cd wa-core && go fix ./...
      - cd cli && go fix ./...

  fmt:
    desc: Format and vet all Go code
    cmds:
      - go fmt ./...
      - gofmt -w -s .
      - cd cli && go fmt ./...
      - cd cli && gofmt -w -s .
      - go vet ./...
      - cd cli && go vet ./...

  test:
    desc: Run the test suite
    cmds:
      - |
        PKGS=$(go list -f '{{"{{"}}if .TestGoFiles{{"}}"}}{{"{{"}}.ImportPath{{"}}"}}{{"{{"}}end{{"}}"}}' ./...)
        if [ -n "$PKGS" ]; then go test -v -timeout 120s $PKGS; fi
      - cd wa-core && go test -v -timeout 60s ./...
      - cd cli && go test -v -timeout 60s ./...

  update:
    desc: Upgrade all Go dependencies
    cmds:
      - go get -u ./...
      - go mod tidy
      - cd cli && go get -u ./...
      - cd cli && go mod tidy

  bump:
    desc: Bump release version to current date (day.month.year) across version.txt and cli
    cmds:
      - go run ./scripts/*.go bump {{.CLI_ARGS}}

  proto:
    desc: Compile and update all wa-core protobuf definitions
    cmds:
      - go run ./scripts/*.go proto {{.CLI_ARGS}}

  build:
    desc: "Build stripped, optimized binary executable into {{.BIN_PATH}}"
    env:
      GOEXPERIMENT: nojsonv2
    cmds:
      - cmd: mkdir -p bin
        platforms: [linux, darwin, windows]
      - cd cli && go build -trimpath -ldflags="-s -w -buildid=" -v -o ../{{.BIN_PATH}} .

  clean:
    desc: Remove build artifacts and temporary files
    cmds:
      - cmd: rm -rf bin/ tmp/
        platforms: [linux, darwin]
      - cmd: powershell -Command "Remove-Item -Recurse -Force bin, tmp -ErrorAction SilentlyContinue"
        platforms: [windows]
