<svg width="520" height="72" viewBox="0 0 520 72" xmlns="http://www.w3.org/2000/svg">
  <style>
    .base { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, monospace; font-size: 40px; }
    .dim  { fill: #8a8a8a; }
    .bold { fill: #1a1a1a; font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .bold { fill: #ffffff; }
    }

    .word { opacity: 0; }

    /* Reveal now ramps in over a slightly longer window (0% -> 9%) for a smoother start every cycle */
    @keyframes reveal {
      0%   { clip-path: inset(0 100% 0 0); }
      9%   { clip-path: inset(0 0 0 0); }
      20%  { clip-path: inset(0 0 0 0); }
      21%  { clip-path: inset(0 100% 0 0); }
      100% { clip-path: inset(0 100% 0 0); }
    }
    /* Opacity now ramps over the same window as reveal, instead of snapping at 0.1% */
    @keyframes show {
      0%   { opacity: 0; }
      9%   { opacity: 1; }
      20%  { opacity: 1; }
      21%  { opacity: 0; }
      100% { opacity: 0; }
    }

    .w1 { animation: show 8.61s infinite 0s,      reveal 8.61s infinite 0s; }
    .w2 { animation: show 8.61s infinite 2.1525s, reveal 8.61s infinite 2.1525s; }
    .w3 { animation: show 8.61s infinite 4.305s,  reveal 8.61s infinite 4.305s; }
    .w4 { animation: show 8.61s infinite 6.4575s, reveal 8.61s infinite 6.4575s; }
  </style>

  <text x="0" y="50" class="base dim">whatsrook</text>

  <text x="230" y="50" class="base bold word w1">client</text>
  <text x="230" y="50" class="base bold word w2">automation</text>
  <text x="230" y="50" class="base bold word w3">bot</text>
  <text x="230" y="50" class="base bold word w4">cli</text>
</svg>