<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Go gopher holding a WhatsApp chat bubble">
  <title>Gopher holding a WhatsApp bubble</title>

  <!-- Ground shadow -->
  <ellipse cx="170" cy="372" rx="105" ry="12" fill="#000" opacity="0.12"/>

  <!-- Feet -->
  <ellipse cx="128" cy="360" rx="26" ry="12" fill="#F6D2A2" stroke="#000" stroke-width="3"/>
  <ellipse cx="212" cy="360" rx="26" ry="12" fill="#F6D2A2" stroke="#000" stroke-width="3"/>

  <!-- Ears -->
  <circle cx="92" cy="92" r="22" fill="#6AD7E5" stroke="#000" stroke-width="3"/>
  <circle cx="92" cy="92" r="10" fill="#000" opacity="0.25"/>
  <circle cx="248" cy="92" r="22" fill="#6AD7E5" stroke="#000" stroke-width="3"/>
  <circle cx="248" cy="92" r="10" fill="#000" opacity="0.25"/>

  <!-- Body -->
  <path d="M70 180 C70 95 120 70 170 70 C220 70 270 95 270 180 L270 300 C270 345 230 362 170 362 C110 362 70 345 70 300 Z"
        fill="#6AD7E5" stroke="#000" stroke-width="3"/>

  <!-- Left arm (resting) -->
  <ellipse cx="68" cy="230" rx="12" ry="24" fill="#F6D2A2" stroke="#000" stroke-width="3" transform="rotate(20 68 230)"/>

  <!-- Eyes -->
  <circle cx="128" cy="140" r="30" fill="#fff" stroke="#000" stroke-width="3"/>
  <circle cx="212" cy="140" r="30" fill="#fff" stroke="#000" stroke-width="3"/>
  <circle cx="138" cy="144" r="11" fill="#000"/>
  <circle cx="222" cy="144" r="11" fill="#000"/>
  <circle cx="142" cy="140" r="3.5" fill="#fff"/>
  <circle cx="226" cy="140" r="3.5" fill="#fff"/>

  <!-- Snout, nose, teeth -->
  <ellipse cx="170" cy="190" rx="26" ry="18" fill="#F6D2A2" stroke="#000" stroke-width="3"/>
  <ellipse cx="170" cy="178" rx="11" ry="7" fill="#000"/>
  <rect x="161" y="204" width="18" height="16" rx="3" fill="#fff" stroke="#000" stroke-width="2.5"/>
  <line x1="170" y1="204" x2="170" y2="220" stroke="#000" stroke-width="2"/>

  <!-- WhatsApp bubble -->
  <g transform="translate(300 200)">
    <!-- Outer white ring with tail -->
    <path d="M-62 62 L-52 26 A62 62 0 1 1 -26 52 Z" fill="#fff" stroke="#000" stroke-width="3" stroke-linejoin="round"/>
    <!-- Green disc -->
    <circle cx="0" cy="0" r="52" fill="#25D366"/>
    <!-- Phone handset -->
    <path d="M-22 -26 C-26 -22 -30 -14 -26 -2 C-20 16 -2 30 14 32 C24 33 30 28 32 24
             C33 21 32 19 30 18 L18 12 C16 11 14 11 12 13 L8 18
             C-4 13 -12 4 -16 -6 L-11 -10 C-9 -12 -9 -14 -10 -16 L-16 -27
             C-17 -29 -20 -29 -22 -26 Z"
          fill="#fff"/>
  </g>

  <!-- Right arm holding the bubble (drawn last so the paw overlaps) -->
  <path d="M262 240 C280 238 292 248 300 258" fill="none" stroke="#000" stroke-width="3"/>
  <ellipse cx="258" cy="262" rx="20" ry="14" fill="#F6D2A2" stroke="#000" stroke-width="3" transform="rotate(-25 258 262)"/>
  <path d="M248 254 l6 6 M256 250 l6 6" stroke="#000" stroke-width="2" stroke-linecap="round"/>
</svg>
